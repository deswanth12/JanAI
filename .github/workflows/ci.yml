name: JanAI CI/CD Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Backend Syntax Verification
        run: |
          python -m py_compile backend/app/main.py backend/app/database.py backend/auth/*.py backend/services/*.py

      - name: Run Automated Workflow & AI Benchmark Tests
        run: |
          python backend/tests/test_e2e_workflows.py
          python backend/tests/evaluate_ai_quality.py
          python backend/tests/test_search_quality.py

  frontend-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint Verification
        run: |
          cd frontend
          npm run lint

      - name: Run Production Bundle Build
        run: |
          cd frontend
          npm run build
