site_name: JanAI Documentation
site_description: Official Documentation for JanAI Enterprise AI Citizen Welfare Platform
site_author: Devanth Baskar (Founder)
repo_url: https://github.com/deswanth12/JanAI
repo_name: deswanth12/JanAI

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 🏠 Home: index.md
  - 🚀 Getting Started: getting-started/index.md
  - 🏛️ Architecture: architecture/system-architecture.md
  - ⚙️ Backend Domains:
      - Identity Domain: backend/identity-domain.md
      - Citizen Domain: backend/citizen-domain.md
      - Scheme Domain: backend/scheme-domain.md
      - Application Domain: backend/application-domain.md
      - Document Domain: backend/document-domain.md
      - Notification Domain: backend/notification-domain.md
      - AI Domain: backend/ai-domain.md
      - Audit Domain: backend/audit-domain.md
      - Search Domain: backend/search-domain.md
  - 🤖 AI Engine: ai/rag-pipeline.md
  - 🔒 Security: security/security-guide.md
  - 📡 API Reference: api/api-reference.md
  - 🚀 Deployment: deployment/cloud-deployment.md
  - 📊 Operations: operations/janai-os-manual.md
  - 🧪 Pilot Handbook: pilot/ap-pilot-handbook.md
  - 👥 User Guides:
      - Citizen Guide: user-guides/citizen-guide.md
      - Partner Guide: user-guides/partner-guide.md
      - Administrator Guide: user-guides/administrator-guide.md
  - 📖 ADRs:
      - 0001 Modular Monolith: adr/0001-modular-monolith.md
      - 0002 RS256 JWT Auth: adr/0002-rs256-jwt-authentication.md
      - 0003 EventBus EDA: adr/0003-event-driven-architecture-eventbus.md
      - 0004 PBAC Control: adr/0004-permission-based-access-control-pbac.md
      - 0005 Grounded RAG: adr/0005-grounded-gazette-rag-reasoning.md
      - 0006 Document Vault: adr/0006-secure-document-vault-and-magic-bytes.md
      - 0007 Search Domain: adr/0007-search-and-vector-domain.md
      - 0008 Role-Based Views: adr/0008-role-based-operational-views.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.def_list_validator
  - tables
  - admonition
